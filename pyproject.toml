[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# See https://www.python.org/dev/peps/pep-0621/
name = "aiida-dftbplus"
dynamic = ["version"]  # read from aiida_dftbplus/src/__init__.py
description = "AiiDA plugin for DFTB+ calculations"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA"
]
keywords = ["aiida", "plugin"]
requires-python = ">=3.9"
dependencies = [
    "aiida-core>=2.5,<3",
    "voluptuous"
]

[project.optional-dependencies]
pre-commit = [
  'pre-commit>=3.5,<5.0',
]
tests = [
    'pgtest~=1.3,>=1.3.1',
    # Upper bounds are deliberately left off: `hatch test` pins its own recent
    # pytest, and a hard `~=7.0` here makes that environment unresolvable.
    'coverage>=7',
    'pytest>=7',
    'pytest-cov>=4.1',
    'ipdb',
]

# The documentation toolchain lives in a PEP 735 dependency group (see
# [dependency-groups] below), not in an extra: it must never be installable as
# part of what a user gets from `pip install aiida-dftbplus[...]`.

[dependency-groups]
# Build the documentation with: pip install -e . --group docs && make -C docs
# (or `hatch run docs:build`, which installs this group for you).
docs = [
    "sphinx~=7.2",
    "myst-parser~=4.0",
    "sphinx-autodoc-typehints~=2.0",
    "sphinx-copybutton~=0.5",
    "sphinx-design~=0.5",
    "pydata-sphinx-theme~=0.15",
]

[project.urls]
Documentation = "https://aiida-dftbplus.readthedocs.io/"

[project.entry-points."aiida.data"]
"dftbplus" = "aiida_dftbplus.data:DftbParameters"

[project.entry-points."aiida.calculations"]
"dftbplus" = "aiida_dftbplus.calculations:DftbPlusCalculation"

[project.entry-points."aiida.parsers"]
"dftbplus" = "aiida_dftbplus.parsers:DftbPlusParser"

[project.entry-points."aiida.cmdline.data"]
"dftbplus" = "aiida_dftbplus.cli:data_cli"

[tool.pytest.ini_options]
# Configuration for [pytest](https://docs.pytest.org)
python_files = "test_*.py example_*.py"
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb"
filterwarnings = [
    "ignore::DeprecationWarning:aiida:",
    "ignore:Creating AiiDA configuration folder:",
    "ignore::DeprecationWarning:plumpy:",
    "ignore::DeprecationWarning:yaml:",
]


[tool.coverage.run]
# Configuration of [coverage.py](https://coverage.readthedocs.io)
# reporting which lines of your plugin are covered by tests
source = ["src/aiida_dftbplus"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
# Configuration for [bandit](https://bandit.readthedocs.io), the SAST job.
exclude_dirs = ["tests", "docs", "examples"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  'F403',  # Star imports unable to detect undefined names
  'F405',  # Import may be undefined or defined from star imports
  'PLR0911',  # Too many return statements
  'PLR0912',  # Too many branches
  'PLR0913',  # Too many arguments in function definition
  'PLR0915',  # Too many statements
  'PLR2004',  # Magic value used in comparison
  'RUF005',  # Consider iterable unpacking instead of concatenation
  'RUF012'  # Mutable class attributes should be annotated with `typing.ClassVar`
]
select = [
  'E',  # pydocstyle
  'W',  # pydocstyle
  'F',  # pyflakes
  'I',  # isort
  'N',  # pep8-naming
  'PLC',  # pylint-convention
  'PLE',  # pylint-error
  'PLR',  # pylint-refactor
  'PLW',  # pylint-warning
  'RUF'  # ruff
]

## Hatch configurations

[tool.hatch.version]
path = "src/aiida_dftbplus/__init__.py"

[tool.hatch.envs.hatch-test]
# The test dependencies live in the `tests` extra so that `hatch test` and a
# plain `pip install -e .[tests] && pytest` (what CI does) install the same set.
features = ["tests"]

[tool.hatch.envs.hatch-test.scripts]
# These are the efault scripts provided by hatch.
# The have been copied to make the execution more transparent

# This command is run with the command `hatch test`
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
# The three commands below are run with the command `hatch test --coverage`
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = "coverage report"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.9", "3.10", "3.11", "3.12"]

[tool.hatch.envs.hatch-static-analysis]
dependencies = ["ruff==0.4.3"]

[tool.hatch.envs.hatch-static-analysis.scripts]
# Fixes are executed with `hatch fmt`.
# Checks are executed with `hatch fmt --check`.

format-check = "ruff format --check --config pyproject.toml {args:.}"
format-fix = "ruff format --config pyproject.toml {args:.}"
lint-check = "ruff check --config pyproject.toml {args:.}"
lint-fix = "ruff check --config pyproject.toml --fix --exit-non-zero-on-fix --show-fixes {args:.}"

[tool.hatch.envs.security]
# Static application security testing, runnable locally with `hatch run security:all`.
# CI runs the exact same commands.
detached = true
dependencies = [
    "bandit[toml]~=1.7",
    "pip-audit~=2.7"
]

[tool.hatch.envs.security.scripts]
# Source-code SAST: fail on anything of medium severity or above.
sast = "bandit -c pyproject.toml -r src/ -ll {args}"
# Dependency SCA: known CVEs in the resolved dependency tree.
audit = "pip-audit --strict --progress-spinner off {args:.}"
all = ["sast", "audit"]

[tool.hatch.envs.docs]
# The dependencies themselves live in the [dependency-groups] docs group, so
# `hatch run docs:build` and a plain `pip install -e . --group docs` install
# exactly the same toolchain.
dependency-groups = ["docs"]

[tool.hatch.envs.docs.scripts]
# Warnings are errors: a broken cross-reference must not reach the site.
build = "make -C docs"
# Rebuild from scratch — an incremental build silently hides autodoc and
# cross-reference warnings that CI will then fail on.
rebuild = "make -C docs clean-all html"
# External link check; run on a schedule rather than as a build gate.
linkcheck = "make -C docs linkcheck"
# Serve the built site locally on http://localhost:8000
serve = "python -m http.server 8000 --directory docs/build/html"
