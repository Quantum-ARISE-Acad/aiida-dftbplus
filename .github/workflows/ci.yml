name: ci

# Every gate the project has: lint -> SAST -> build -> test -> docs.
# `workflow_call` makes this file reusable, so release.yml runs the exact same
# gates before anything is published.

# No push trigger: release.yml owns pushes to main and tags, and calls this
# workflow. Triggering on push here as well would run every gate twice.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Least privilege by default; jobs that need more raise it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that is part of a release.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Pinned so a new hatch release cannot change what CI does overnight.
  HATCH_VERSION: "1.17.1"

jobs:

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # There is no requirements.txt in this repository, so the cache key
          # has to be derived from pyproject.toml instead of the default glob.
          cache-dependency-path: pyproject.toml

      - name: Install hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      # Same command as the pre-commit hook, so local and CI verdicts agree.
      - name: Check formatting and lint
        run: hatch fmt --check

  sast:
    name: sast (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # There is no requirements.txt in this repository, so the cache key
          # has to be derived from pyproject.toml instead of the default glob.
          cache-dependency-path: pyproject.toml

      - name: Install hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      # Source-code SAST over the plugin's own code. Blocking: findings here
      # are ours to fix. Fails on medium severity and above.
      - name: Bandit
        run: hatch run security:sast --format screen

      - name: Bandit report
        if: always()
        run: hatch run security:sast --format json --output bandit-report.json --exit-zero

      # Known CVEs in the dependency tree. Deliberately non-blocking: most
      # findings sit in transitive dependencies of aiida-core (and sometimes in
      # the build environment itself) with no fix this project can apply, so a
      # blocking gate here would only teach people to ignore red builds. The
      # result is surfaced in the job summary instead, and new risky
      # dependencies are blocked on pull requests by the dependency-review job.
      - name: pip-audit
        id: pip-audit
        continue-on-error: true
        # `shell: bash` rather than the default, for pipefail: without it the
        # exit status of tee would mask a failing audit.
        shell: bash
        run: |
          hatch run security:audit --format markdown | tee pip-audit.md

      - name: Publish audit result to the job summary
        if: always()
        run: |
          {
            echo '## Dependency audit (pip-audit)'
            if [ "${{ steps.pip-audit.outcome }}" = "success" ]; then
              echo 'No known vulnerabilities in the dependency tree.'
            else
              echo 'Known vulnerabilities found — review whether any are reachable from this plugin:'
              echo
              cat pip-audit.md || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: warn

  # Flags dependencies with known vulnerabilities or non-permissive licences
  # before they are merged. Pull requests only — it diffs against the base ref.
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # There is no requirements.txt in this repository, so the cache key
          # has to be derived from pyproject.toml instead of the default glob.
          cache-dependency-path: pyproject.toml

      - name: Install hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      - name: Build distributions
        run: hatch build

      # Catches broken metadata and an unrenderable README before PyPI does.
      - name: Check distribution metadata
        run: |
          pip install twine
          twine check --strict dist/*

      # A wheel that installs but whose entry points do not load is useless to
      # AiiDA, so verify the plugin actually registers.
      - name: Verify the wheel registers its entry points
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --upgrade pip
          /tmp/wheelcheck/bin/pip install dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          from importlib.metadata import entry_points

          expected = {
              'aiida.calculations': 'dftbplus',
              'aiida.parsers': 'dftbplus',
              'aiida.data': 'dftbplus',
              'aiida.cmdline.data': 'dftbplus',
          }
          for group, name in expected.items():
              (ep,) = [e for e in entry_points(group=group) if e.name == name]
              loaded = ep.load()
              print(f'{group}:{name} -> {loaded}')
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The AiiDA test fixtures create a throwaway sqlite profile with no
      # broker, so no PostgreSQL or RabbitMQ service is needed here.
      - name: Install package and test dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[tests]

      - name: Run test suite
        env:
          PYTEST_ADDOPTS: "--durations=10 -p no:cacheprovider"
        run: pytest -v --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml

  # The one job that runs a real DFTB+ binary, so the end-to-end test is
  # actually exercised instead of being skipped.
  integration:
    name: integration (real dftb+)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install DFTB+ from conda-forge
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: dftbplus-ci
          create-args: >-
            python=3.12
            dftbplus
          init-shell: bash
          cache-environment: true

      - name: Install package and test dependencies
        shell: bash -el {0}
        run: |
          pip install --upgrade pip
          pip install -e .[tests]

      - name: Confirm the binary is on PATH
        shell: bash -el {0}
        run: which dftb+

      - name: Run test suite including the end-to-end test
        shell: bash -el {0}
        env:
          PYTEST_ADDOPTS: "-p no:cacheprovider"
        run: pytest -v

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # There is no requirements.txt in this repository, so the cache key
          # has to be derived from pyproject.toml instead of the default glob.
          cache-dependency-path: pyproject.toml

      # The architecture diagrams are rendered from .dot sources at build time.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      # Warnings are errors here, as they are on Read the Docs and on the Pages
      # deployment. `rebuild` cleans first: an incremental build hides autodoc
      # and cross-reference warnings.
      - name: Build docs
        run: hatch run docs:rebuild

  # Single required status check: green only when every gate above is green.
  # Point branch protection at this job rather than at each job individually.
  ci-success:
    name: ci success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, sast, build, test, integration, docs]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All CI gates passed."
