name: docs

# Builds the Sphinx site and deploys it to GitHub Pages.
#
# Pull requests are *not* handled here: the `docs` job in ci.yml already builds
# them with warnings as errors on every PR. This workflow owns deployment, so a
# push to main publishes exactly what those gates approved.
#
# Tags deliberately do NOT trigger it. A tag points at a commit that is already
# on main, so its documentation has been deployed by that push — and the
# `github-pages` environment allows deployments only from the default branch, so
# a tag run would fail its protection rule rather than publish anything new.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Link check only, Mondays at 05:17 UTC. Dead external links surface
    # without blocking a normal build.
    - cron: '17 5 * * 1'

permissions:
  contents: read

# One global group, as GitHub's own Pages workflow recommends: a site has a
# single deployment pipeline, and letting two runs deploy at once makes the
# second one queue behind the first instead of failing cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HATCH_VERSION: "1.17.1"

jobs:

  build:
    name: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The architecture diagrams are rendered from .dot sources at build time.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      # A clean build: an incremental one hides autodoc and cross-reference
      # warnings, and the Makefile treats warnings as errors.
      - name: Build the site
        run: hatch run docs:rebuild

      # GitHub Pages serves _static/ etc. only if Jekyll is disabled.
      - name: Disable Jekyll
        run: touch docs/build/html/.nojekyll

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    name: deploy to github pages
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Generous on purpose: the Pages backend can leave a deployment in
    # `in_progress` for a long time, especially the first one for a new site.
    # A job timeout shorter than the action's own cancels it mid-poll and the
    # deployment is reported as `error` rather than finishing.
    timeout-minutes: 35

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Milliseconds the action waits for the deployment to finish. The
          # default is 10 minutes; keep it below the job timeout above so a
          # genuinely stuck deployment fails with the action's own message
          # instead of being cancelled without one.
          timeout: 1800000

  linkcheck:
    name: link check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      - name: Check external links
        run: hatch run docs:linkcheck

      - name: Publish the result to the job summary
        if: always()
        run: |
          {
            echo '## Documentation link check'
            echo
            echo '```'
            cat docs/build/linkcheck/output.txt 2>/dev/null || echo 'no output file'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
