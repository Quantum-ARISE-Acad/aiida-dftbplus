name: docs

# Link check only. The documentation is hosted on Read the Docs, which builds
# and publishes it from its own webhook on every push to `main` and every tag —
# nothing here deploys the site.
#
# The build itself is still gated on every pull request by the `docs` job in
# ci.yml, with warnings treated as errors, so a broken cross-reference never
# reaches Read the Docs in the first place. `.readthedocs.yml` sets
# `fail_on_warning: true`, which applies the same rule on their builders.

on:
  workflow_dispatch:
  schedule:
    # Mondays at 05:17 UTC. Dead external links surface without blocking a
    # normal build.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HATCH_VERSION: "1.17.1"

jobs:

  linkcheck:
    name: link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      - name: Check external links
        run: hatch run docs:linkcheck

      - name: Publish the result to the job summary
        if: always()
        run: |
          {
            echo '## Documentation link check'
            echo
            echo '```'
            cat docs/build/linkcheck/output.txt 2>/dev/null || echo 'no output file'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
