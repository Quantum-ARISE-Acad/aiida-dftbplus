version: 2

# Read the Docs is the home of the documentation:
# https://aiida-dftbplus.readthedocs.io/. It builds from its own webhook, so no
# GitHub workflow deploys the site; ci.yml only gates the build on pull
# requests, and docs.yml runs the weekly external link check.

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    # The architecture diagrams are rendered from .dot sources at build time.
    - graphviz

python:
  install:
    - method: pip
      path: .
    # The docs toolchain lives in a PEP 735 dependency group, not in an extra.
    - requirements: docs/requirements.txt

sphinx:
    builder: html
    configuration: docs/source/conf.py
    fail_on_warning: true
